<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platform Administrator Dashboard – ConstructHub</title>
<link rel="stylesheet" href="../../css/main.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
.pa-banner { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: white; border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; }
.pa-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.module-tabs { display: flex; gap: 4px; background: var(--bg); border-radius: var(--radius); padding: 4px; margin-bottom: 20px; flex-wrap: wrap; }
.module-tab { padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text-muted); transition: all 0.15s; }
.module-tab.active { background: white; color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
</style>
</head>
<body>
<div class="app-layout">
  <nav class="navbar" id="navbar"></nav>
  <div class="app-body">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="active"><i data-lucide="shield-alert" class="nav-icon"></i> Platform Super Admin</a>
        <div class="sidebar-divider"></div>
        <a href="#" onclick="switchTab('companies')"><i data-lucide="building-2" class="nav-icon"></i> Manage Companies</a>
        <a href="#" onclick="switchTab('revenue')"><i data-lucide="trending-up" class="nav-icon"></i> Platform Revenue & SaaS</a>
        <a href="#" onclick="switchTab('inquiries')"><i data-lucide="mail" class="nav-icon"></i> Contact Inquiries (<span id="count-inquiries">0</span>)</a>
        <a href="#" onclick="switchTab('all-users')"><i data-lucide="users" class="nav-icon"></i> All Global Users</a>
        <a href="#" onclick="switchTab('all-projects')"><i data-lucide="folder" class="nav-icon"></i> All Global Projects</a>
        <div class="sidebar-divider"></div>
        <a href="../../login.html" onclick="logout()"><i data-lucide="log-out" class="nav-icon"></i> Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="pa-banner">
        <div>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
            <span class="badge badge-orange" style="letter-spacing:0.05em"><i data-lucide="shield-check" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i> APPLICATION LEVEL</span>
          </div>
          <h2 style="font-family:var(--font-head);font-size:22px;font-weight:800;margin-bottom:4px">Platform Administration Panel</h2>
          <p style="font-size:13px;opacity:0.75">Global multi-tenant oversight across all registered construction firms</p>
        </div>
        <div>
          <button onclick="openAddCompanyModal()" class="btn btn-primary"><i data-lucide="plus-circle" style="width:16px;height:16px;margin-right:4px"></i> Register New Firm</button>
        </div>
      </div>

      <div class="pa-stats" id="pa-stats"></div>

      <div class="module-tabs">
        <button class="module-tab active" id="tab-btn-companies" onclick="switchTab('companies')"><i data-lucide="building-2" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"></i> Companies (<span id="count-comps">0</span>)</button>
        <button class="module-tab" id="tab-btn-revenue" onclick="switchTab('revenue')"><i data-lucide="trending-up" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"></i> Platform Revenue & SaaS</button>
        <button class="module-tab" id="tab-btn-inquiries" onclick="switchTab('inquiries')"><i data-lucide="mail" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"></i> Contact Inquiries (<span id="count-inq-tab">0</span>)</button>
        <button class="module-tab" id="tab-btn-all-users" onclick="switchTab('all-users')"><i data-lucide="users" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"></i> All Global Users (<span id="count-users">0</span>)</button>
        <button class="module-tab" id="tab-btn-all-projects" onclick="switchTab('all-projects')"><i data-lucide="folder" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"></i> All Global Projects (<span id="count-projs">0</span>)</button>
      </div>

      <div id="platform-view"></div>
    </main>
  </div>
</div>

<!-- Modal: Company Form (Create & Edit) -->
<div id="comp-modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="comp-modal-title">Register Construction Firm</h2>
      <button class="modal-close" onclick="closeModal('comp-modal')"><i data-lucide="x" style="width:16px;height:16px"></i></button>
    </div>
    <form onsubmit="handleSaveCompany(event)">
      <input type="hidden" id="c-id">
      <div class="form-group">
        <label class="form-label">Company Name <span class="req">*</span></label>
        <input id="c-name" type="text" class="form-input" placeholder="e.g. Apex Builders" required>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Company Code <span class="req">*</span></label>
          <input id="c-code" type="text" class="form-input" placeholder="e.g. apex" required>
        </div>
        <div class="form-group">
          <label class="form-label">Approved Domain <span class="req">*</span></label>
          <input id="c-domain" type="text" class="form-input" placeholder="e.g. apex.com" required>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Owner Email <span class="req">*</span></label>
          <input id="c-email" type="email" class="form-input" placeholder="admin@apex.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Company Phone Number <span class="req">*</span></label>
          <input id="c-phone" type="tel" class="form-input" placeholder="10-digit phone (e.g. 9800011111)" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)" required>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Subscription Plan</label>
          <select id="c-plan" class="form-select">
            <option value="Enterprise">Enterprise</option>
            <option value="Pro">Pro</option>
            <option value="Basic">Basic</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Billing Cycle</label>
          <select id="c-billing" class="form-select">
            <option value="monthly">Monthly</option>
            <option value="annual">Annual</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Subscription Status</label>
        <select id="c-status" class="form-select">
          <option value="active">active</option>
          <option value="inactive">inactive</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" onclick="closeModal('comp-modal')" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary" id="c-submit-btn">Save Company Workspace</button>
      </div>
    </form>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/utils.js"></script>
<script>
let currentUser;

window.onload = () => {
  initDB();
  currentUser = requireAuth(['superuser']);
  if (!currentUser) return;

  renderNavbar(currentUser);
  renderStats();
  switchTab('companies');
};

function renderStats() {
  const comps = getAll('companies');
  const users = getAll('users');
  const projs = getAll('projects');
  const revRaw = sendSync('GET', 'companies/platform/revenue');
  const rev = (revRaw && !revRaw.error) ? revRaw : {};
  const inqsRaw = sendSync('GET', 'inquiries');
  const inqs = (inqsRaw && Array.isArray(inqsRaw)) ? inqsRaw : [];

  const mrr = rev.mrr || comps.reduce((sum, c) => sum + (c.plan === 'Pro' ? 9999 : (c.plan === 'Basic' ? 4999 : 19999)), 0);
  const arr = rev.arr || (mrr * 12);
  const newInqs = Array.isArray(inqs) ? inqs.filter(i => i.status === 'New').length : 0;
  const avgRev = rev.averageRevenuePerCompany || (comps.length ? Math.round(mrr / comps.length) : 0);

  document.getElementById('count-comps').textContent = comps.length;
  document.getElementById('count-users').textContent = users.length;
  document.getElementById('count-projs').textContent = projs.length;
  if (document.getElementById('count-inquiries')) document.getElementById('count-inquiries').textContent = newInqs;
  if (document.getElementById('count-inq-tab')) document.getElementById('count-inq-tab').textContent = newInqs;

  document.getElementById('pa-stats').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Active SaaS Subscriptions</div>
      <div class="stat-value">${rev.activeCompanies || comps.length}</div>
      <div class="stat-change" style="color:var(--primary)">Registered SaaS Tenants</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Platform MRR</div>
      <div class="stat-value" style="color:var(--green)">${formatCurrency(mrr)}</div>
      <div class="stat-change" style="color:var(--green)">Monthly Recurring Revenue</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">New Platform Inquiries</div>
      <div class="stat-value" style="color:var(--orange)">${newInqs}</div>
      <div class="stat-change" style="color:var(--text-muted)">Contact Us Submissions</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Average Revenue / Tenant</div>
      <div class="stat-value">${formatCurrency(avgRev)}</div>
      <div class="stat-change" style="color:var(--green)">ARPU per firm</div>
    </div>
  `;
}

function updateInquiryStatus(id, status) {
  const res = sendSync('PATCH', 'inquiries/' + id, { status });
  if (res && res.error) {
    showToast(res.message || 'Failed to update inquiry status', 'error');
    return;
  }
  showToast(`Inquiry marked as ${status}`, 'success');
  renderStats();
  switchTab('inquiries');
}

function switchTab(tab) {
  document.querySelectorAll('.module-tab').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tab-btn-' + tab);
  if (btn) btn.classList.add('active');

  const view = document.getElementById('platform-view');

  if (tab === 'companies') {
    const comps = getAll('companies');
    view.innerHTML = `
      <div class="card">
        <div class="card-header" style="display:flex;align-items:center;justify-content:space-between">
          <div class="card-title">Registered Construction Firms (${comps.length})</div>
          <button onclick="openAddCompanyModal()" class="btn btn-primary btn-sm"><i data-lucide="plus" style="width:14px;height:14px;margin-right:4px"></i> Add Firm</button>
        </div>
        <table class="data-table">
          <thead><tr><th>Company</th><th>Code</th><th>Domain</th><th>Owner Email</th><th>Plan</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody>
            ${comps.map(c => `
              <tr>
                <td><strong>${c.name}</strong></td>
                <td><span class="badge badge-gray">${c.code}</span></td>
                <td><strong>@${c.domain}</strong></td>
                <td>${c.ownerEmail}</td>
                <td><span class="badge badge-orange">${c.plan || 'Enterprise'}</span></td>
                <td>${statusBadge(c.status || 'active')}</td>
                <td style="text-align:right">
                  <button onclick="openEditCompanyModal('${c.id}')" class="btn btn-secondary btn-sm" title="Edit Company"><i data-lucide="edit" style="width:14px;height:14px"></i> Edit</button>
                  <button onclick="deleteCompany('${c.id}')" class="btn btn-danger btn-sm" title="Delete Company"><i data-lucide="trash-2" style="width:14px;height:14px"></i> Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  } else if (tab === 'inquiries') {
    const rawInqs = sendSync('GET', 'inquiries');
    const inqs = Array.isArray(rawInqs) ? rawInqs : [];

    view.innerHTML = `
      <div class="card">
        <div class="card-header" style="display:flex;align-items:center;justify-content:space-between">
          <div class="card-title"><i data-lucide="mail" style="width:16px;height:16px;vertical-align:middle;margin-right:6px"></i> Platform Contact Us Sales Inquiries (${inqs.length})</div>
          <button onclick="renderStats();switchTab('inquiries')" class="btn btn-secondary btn-sm"><i data-lucide="refresh-cw" style="width:14px;height:14px;margin-right:4px"></i> Refresh</button>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Submitted Date/Time</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Message</th>
              <th>Status</th>
              <th style="text-align:right">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${inqs.length === 0 ? '<tr><td colspan="7" style="text-align:center;color:var(--text-muted)">No inquiries received yet.</td></tr>' : inqs.map(i => {
              const dateStr = formatDate(i.createdAt);
              let statusBadgeHtml = '<span class="badge badge-orange">New</span>';
              if (i.status === 'Read') statusBadgeHtml = '<span class="badge badge-blue">Read</span>';
              if (i.status === 'Resolved') statusBadgeHtml = '<span class="badge badge-green">Resolved</span>';

              return `
                <tr style="${i.status === 'New' ? 'background:rgba(249,115,22,0.05);' : ''}">
                  <td><small style="color:var(--text-muted)">${dateStr}</small></td>
                  <td><strong>${i.name}</strong></td>
                  <td>${i.email}</td>
                  <td><strong>${i.phone}</strong></td>
                  <td style="max-width:250px;"><div style="font-size:12.5px;color:var(--text);word-break:break-word">${i.message}</div></td>
                  <td>${statusBadgeHtml}</td>
                  <td style="text-align:right">
                    ${i.status === 'New' ? `<button onclick="updateInquiryStatus('${i.id}', 'Read')" class="btn btn-secondary btn-sm" title="Mark as Read"><i data-lucide="eye" style="width:14px;height:14px;margin-right:2px"></i> Read</button>` : ''}
                    ${i.status !== 'Resolved' ? `<button onclick="updateInquiryStatus('${i.id}', 'Resolved')" class="btn btn-success btn-sm" style="margin-left:4px" title="Mark as Resolved"><i data-lucide="check-circle" style="width:14px;height:14px;margin-right:2px"></i> Resolve</button>` : ''}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  } else if (tab === 'revenue') {
    const revRaw = sendSync('GET', 'companies/platform/revenue');
    const rev = (revRaw && !revRaw.error) ? revRaw : {};
    const allComps = getAll('companies');
    const subs = rev.subscriptions || allComps.map(c => ({
      companyName: c.name, code: c.code, domain: c.domain, plan: c.plan || 'Enterprise',
      billingCycle: c.billingCycle || 'monthly', monthlyEquivalent: (c.plan === 'Pro' ? 9999 : (c.plan === 'Basic' ? 4999 : 19999)),
      overageEnabled: !!c.overageEnabled, extraUsers: c.extraUsers || 0, extraProjects: c.extraProjects || 0,
      overageRevenue: ((c.extraUsers || 0) * 499) + ((c.extraProjects || 0) * 1999),
      totalMonthlyRevenue: (c.plan === 'Pro' ? 9999 : (c.plan === 'Basic' ? 4999 : 19999)) + (((c.extraUsers || 0) * 499) + ((c.extraProjects || 0) * 1999)),
      subscriptionStatus: c.status || 'active'
    }));
    const byPlan = rev.byPlan || {
      Basic: { companies: allComps.filter(c => c.plan === 'Basic').length, mrr: allComps.filter(c => c.plan === 'Basic').length * 4999 },
      Pro: { companies: allComps.filter(c => c.plan === 'Pro').length, mrr: allComps.filter(c => c.plan === 'Pro').length * 9999 },
      Enterprise: { companies: allComps.filter(c => !c.plan || c.plan === 'Enterprise').length, mrr: allComps.filter(c => !c.plan || c.plan === 'Enterprise').length * 19999 }
    };

    view.innerHTML = `
      <div class="card mb-16" style="margin-bottom:20px;">
        <div class="card-title" style="margin-bottom:14px"><i data-lucide="trending-up" style="width:16px;height:16px;vertical-align:middle;margin-right:6px"></i> Platform Revenue Breakdown (Base SaaS + Usage Overages)</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
          <div style="background:var(--bg);padding:16px;border-radius:var(--radius);border:1px solid var(--border)">
            <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Base SaaS MRR</div>
            <div style="font-size:22px;font-weight:800;color:var(--text);margin:6px 0">${formatCurrency(rev.baseMrr || rev.mrr || 0)}</div>
            <div style="font-size:12px;color:var(--text-muted)">Fixed Subscriptions</div>
          </div>
          <div style="background:var(--bg);padding:16px;border-radius:var(--radius);border:1px solid var(--border)">
            <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Overage MRR</div>
            <div style="font-size:22px;font-weight:800;color:var(--green);margin:6px 0">${formatCurrency(rev.overageMrr || 0)}</div>
            <div style="font-size:12px;color:var(--green);font-weight:600">Extra Users & Projects</div>
          </div>
          <div style="background:var(--bg);padding:16px;border-radius:var(--radius);border:1px solid var(--border)">
            <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Total MRR</div>
            <div style="font-size:22px;font-weight:800;color:var(--primary);margin:6px 0">${formatCurrency(rev.mrr || 0)}</div>
            <div style="font-size:12px;color:var(--primary);font-weight:600">Monthly Run Rate</div>
          </div>
          <div style="background:var(--bg);padding:16px;border-radius:var(--radius);border:1px solid var(--border)">
            <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Platform ARR</div>
            <div style="font-size:22px;font-weight:800;color:var(--text);margin:6px 0">${formatCurrency(rev.arr || 0)}</div>
            <div style="font-size:12px;color:var(--text-muted)">Annualized Projection</div>
          </div>
        </div>
      </div>

      <div class="card mb-16" style="margin-bottom:20px;">
        <div class="card-title" style="margin-bottom:14px">Revenue Share by Subscription Tier</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
          <div style="background:var(--bg);padding:16px;border-radius:var(--radius);border:1px solid var(--border)">
            <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Basic Tier (₹4,999/mo)</div>
            <div style="font-size:22px;font-weight:800;color:var(--text);margin:6px 0">${byPlan.Basic?.companies || 0} Firms</div>
            <div style="font-size:13px;color:var(--green);font-weight:700">MRR: ${formatCurrency(byPlan.Basic?.mrr || 0)}</div>
          </div>
          <div style="background:var(--bg);padding:16px;border-radius:var(--radius);border:1px solid var(--border)">
            <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Pro Tier (₹9,999/mo)</div>
            <div style="font-size:22px;font-weight:800;color:var(--text);margin:6px 0">${byPlan.Pro?.companies || 0} Firms</div>
            <div style="font-size:13px;color:var(--green);font-weight:700">MRR: ${formatCurrency(byPlan.Pro?.mrr || 0)}</div>
          </div>
          <div style="background:var(--bg);padding:16px;border-radius:var(--radius);border:1px solid var(--border)">
            <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Enterprise Tier (₹19,999/mo)</div>
            <div style="font-size:22px;font-weight:800;color:var(--text);margin:6px 0">${byPlan.Enterprise?.companies || 0} Firms</div>
            <div style="font-size:13px;color:var(--green);font-weight:700">MRR: ${formatCurrency(byPlan.Enterprise?.mrr || 0)}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Tenant SaaS Subscriptions & Monthly Revenue (${subs.length})</div>
        <table class="data-table">
          <thead><tr><th>Company Workspace</th><th>Approved Domain</th><th>Plan</th><th>Overage Status</th><th>Extra Usage</th><th>Base MRR</th><th>Total MRR</th></tr></thead>
          <tbody>
            ${subs.map(s => `
              <tr>
                <td><strong>${s.companyName}</strong> (${s.code})</td>
                <td><strong>@${s.domain}</strong></td>
                <td><span class="badge badge-orange">${s.plan}</span></td>
                <td>${s.overageEnabled ? '<span class="badge badge-green">Enabled</span>' : '<span class="badge badge-gray">Disabled</span>'}</td>
                <td><small style="color:var(--text-muted)">Users: +${s.extraUsers || 0} | Projs: +${s.extraProjects || 0}</small></td>
                <td>${formatCurrency(s.monthlyEquivalent)}/mo</td>
                <td><strong style="color:var(--green)">${formatCurrency(s.totalMonthlyRevenue || s.monthlyEquivalent)}</strong>/mo</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  } else if (tab === 'all-users') {
    const users = getAll('users');
    const compsMap = Object.fromEntries(getAll('companies').map(c => [c.id, c.name]));
    view.innerHTML = `
      <div class="card">
        <div class="card-title">Global Platform Users (${users.length})</div>
        <table class="data-table">
          <thead><tr><th>User</th><th>Role</th><th>Company Tenant</th><th>Email</th><th>Status</th></tr></thead>
          <tbody>
            ${users.map(u => `
              <tr>
                <td><strong>${u.name}</strong></td>
                <td>${roleBadge(u.role)}</td>
                <td>${compsMap[u.companyId] ? `<strong>${compsMap[u.companyId]}</strong>` : 'Platform Admin'}</td>
                <td>${u.email}</td>
                <td>${statusBadge(u.status || 'active')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  } else if (tab === 'all-projects') {
    const projs = getAll('projects');
    const compsMap = Object.fromEntries(getAll('companies').map(c => [c.id, c.name]));
    view.innerHTML = `
      <div class="card">
        <div class="card-title">Global Construction Projects (${projs.length})</div>
        <table class="data-table">
          <thead><tr><th>Project Name</th><th>Company Tenant</th><th>Client</th><th>Manager</th><th>Budget</th><th>Status</th></tr></thead>
          <tbody>
            ${projs.map(p => `
              <tr>
                <td><strong>${p.name}</strong><br><small style="color:var(--text-muted)">${p.location}</small></td>
                <td><strong>${compsMap[p.companyId] || 'N/A'}</strong></td>
                <td>${p.clientName}</td>
                <td>${p.managerName || 'Manager'}</td>
                <td><strong>${formatCurrency(p.budget)}</strong></td>
                <td>${statusBadge(p.status)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }
  lucide.createIcons();
}

function clearCompFormErrors() {
  ['c-name', 'c-code', 'c-domain', 'c-email', 'c-phone'].forEach(id => {
    const el = document.getElementById(id);
    if (el) clearError(el);
  });
}

function openAddCompanyModal() {
  clearCompFormErrors();
  document.getElementById('comp-modal-title').textContent = 'Register Construction Firm';
  document.getElementById('c-submit-btn').textContent = 'Create Firm Workspace';
  document.getElementById('c-id').value = '';
  document.getElementById('c-name').value = '';
  document.getElementById('c-code').value = '';
  document.getElementById('c-domain').value = '';
  document.getElementById('c-email').value = '';
  document.getElementById('c-phone').value = '';
  document.getElementById('c-plan').value = 'Enterprise';
  document.getElementById('c-billing').value = 'monthly';
  document.getElementById('c-status').value = 'active';
  openModal('comp-modal');
}

function openEditCompanyModal(id) {
  const comp = getById('companies', id);
  if (!comp) return;
  clearCompFormErrors();
  document.getElementById('comp-modal-title').textContent = 'Edit Construction Firm & Subscription';
  document.getElementById('c-submit-btn').textContent = 'Update Company';
  document.getElementById('c-id').value = comp.id;
  document.getElementById('c-name').value = comp.name;
  document.getElementById('c-code').value = comp.code;
  document.getElementById('c-domain').value = comp.domain;
  document.getElementById('c-email').value = comp.ownerEmail;
  document.getElementById('c-phone').value = comp.phone || '';
  document.getElementById('c-plan').value = comp.plan || 'Enterprise';
  document.getElementById('c-billing').value = comp.billingCycle || 'monthly';
  document.getElementById('c-status').value = comp.status || 'active';
  openModal('comp-modal');
}

function deleteCompany(id) {
  const comp = getById('companies', id);
  if (!comp) return;
  if (!confirm(`Are you sure you want to delete "${comp.name}"? This action cannot be undone.`)) return;

  remove('companies', id);
  showToast(`Company "${comp.name}" deleted successfully.`);
  renderStats();
  switchTab('companies');
}

function handleSaveCompany(e) {
  e.preventDefault();
  clearCompFormErrors();

  const id = document.getElementById('c-id').value;
  const nameEl = document.getElementById('c-name');
  const codeEl = document.getElementById('c-code');
  const domainEl = document.getElementById('c-domain');
  const emailEl = document.getElementById('c-email');
  const phoneEl = document.getElementById('c-phone');

  const name = nameEl.value.trim();
  const code = codeEl.value.trim().toLowerCase();
  const domain = domainEl.value.trim().toLowerCase();
  const email = emailEl.value.trim();
  const phone = phoneEl.value.trim();
  const plan = document.getElementById('c-plan').value;
  const billingCycle = document.getElementById('c-billing').value;
  const status = document.getElementById('c-status').value;

  let isValid = true;

  if (!name) {
    showError(nameEl, 'Company Name is required');
    isValid = false;
  }

  if (!code) {
    showError(codeEl, 'Company Code is required');
    isValid = false;
  } else if (!/^[a-zA-Z0-9_-]+$/.test(code)) {
    showError(codeEl, 'Code must contain only letters, numbers, hyphens or underscores');
    isValid = false;
  }

  if (!domain) {
    showError(domainEl, 'Approved Domain is required');
    isValid = false;
  } else if (!isValidDomain(domain)) {
    showError(domainEl, 'Enter a valid domain name (e.g. apex.com)');
    isValid = false;
  }

  if (!email) {
    showError(emailEl, 'Owner Email is required');
    isValid = false;
  } else if (!isValidEmail(email)) {
    showError(emailEl, 'Enter a valid email address');
    isValid = false;
  }

  if (!phone) {
    showError(phoneEl, 'Company Phone Number is required');
    isValid = false;
  } else if (!isValidPhone(phone)) {
    showError(phoneEl, 'Phone number must be exactly 10 numeric digits and cannot be all zeros');
    isValid = false;
  }

  if (isValid && domain && email) {
    const emailDomain = email.split('@')[1] || '';
    if (emailDomain.toLowerCase() !== domain.toLowerCase()) {
      showError(emailEl, `Owner email domain (@${emailDomain}) must match approved domain (@${domain})`);
      isValid = false;
    }
  }

  // Client-side uniqueness checks against local dataset
  const allComps = getAll('companies') || [];
  const otherComps = allComps.filter(c => c.id !== id);

  if (isValid && otherComps.some(c => (c.code || '').toLowerCase() === code)) {
    showError(codeEl, `Company code "${code}" is already registered by another firm.`);
    isValid = false;
  }

  if (isValid && otherComps.some(c => (c.domain || '').toLowerCase() === domain)) {
    showError(domainEl, `Company domain "${domain}" is already registered by another firm.`);
    isValid = false;
  }

  if (isValid && otherComps.some(c => (c.ownerEmail || '').toLowerCase() === email.toLowerCase())) {
    showError(emailEl, `Owner email "${email}" is already registered by another firm.`);
    isValid = false;
  }

  if (!isValid) return;

  if (id) {
    const res = update('companies', id, {
      name,
      code,
      domain,
      ownerEmail: email,
      phone,
      plan,
      billingCycle,
      subscriptionStatus: status,
      status
    });

    if (res && res.error) {
      const msg = res.message || 'Failed to update company';
      if (msg.toLowerCase().includes('domain')) showError(domainEl, msg);
      else if (msg.toLowerCase().includes('email')) showError(emailEl, msg);
      else if (msg.toLowerCase().includes('code')) showError(codeEl, msg);
      else if (msg.toLowerCase().includes('phone')) showError(phoneEl, msg);
      showToast(msg, 'error');
      return;
    }
    showToast('Company subscription updated successfully!');
  } else {
    const res = create('companies', {
      name,
      code,
      domain,
      ownerEmail: email,
      phone,
      plan,
      billingCycle,
      subscriptionStatus: status,
      status,
      createdAt: new Date().toISOString().split('T')[0]
    });

    if (res && res.error) {
      const msg = res.message || 'Failed to create company';
      if (msg.toLowerCase().includes('domain')) showError(domainEl, msg);
      else if (msg.toLowerCase().includes('email')) showError(emailEl, msg);
      else if (msg.toLowerCase().includes('code')) showError(codeEl, msg);
      showToast(msg, 'error');
      return;
    }

    const compId = (res && res.id) ? res.id : (res && res.company && res.company.id) ? res.company.id : '';

    const adminRes = create('users', {
      name: name + ' Admin',
      email,
      password: '123456',
      role: 'company_admin',
      companyId: compId,
      phone: phone || '9800011111',
      avatar: name.substring(0,2).toUpperCase(),
      status: 'active',
      createdAt: new Date().toISOString().split('T')[0]
    });

    if (adminRes && adminRes.error) {
      showToast('Company created, but owner account creation failed: ' + (adminRes.message || 'Error'), 'error');
    } else {
      showToast('Company Workspace & Owner Admin created successfully!');
    }
  }

  closeModal('comp-modal');
  renderStats();
  switchTab('companies');
}
</script>
